[package]
name = "sample-vsti"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "A polyphonic VST3 instrument implemented directly in Rust"
authors = ["Yusuke Oda"]
license = "AGPL-3.0-only"
repository = "https://github.com/predicatejp/sample-vsti"

[lib]
crate-type = ["cdylib"]

[dependencies]
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "=0.37.0", default-features = false }
baseview = { version = "=0.4.2", default-features = false, features = ["opengl"] }
raw-window-handle = "=0.6.2"
keyboard-types = "=0.8.3"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
