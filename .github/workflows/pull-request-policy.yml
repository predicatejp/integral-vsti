name: PR CI

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'CIを実行するPR番号'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  dispatch:
    name: Start PR CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && github.event.comment.body == '/ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # issue_commentはdefault branchのコードだけを実行する。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Dispatch Rust CI for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          REQUESTER: ${{ github.event.comment.user.login || github.actor }}
        run: python3 scripts/pr-ci.py dispatch
