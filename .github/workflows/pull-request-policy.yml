name: Pull request policy

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'マージ先を検査するPR番号'
        required: true
        type: string

permissions:
  pull-requests: read

jobs:
  target:
    name: PR target
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require main as the merge target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          PR_BASE=$(gh pr view "$PR_NUMBER" --json baseRefName --jq .baseRefName)
          if [ "$PR_BASE" != main ]; then
            echo '::error::Pull requests must target main.'
            exit 1
          fi
