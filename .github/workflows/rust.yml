name: Rust CI

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: '検査対象のPR番号（PRの先頭ブランチを選択）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  INTEGRAL_COMMIT: ${{ github.sha }}
  INTEGRAL_RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  target:
    name: PR target
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Mark PR checks pending
        if: inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for context in 'PR target' 'CI result'; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=pending -f context="$context" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify PR target and revision
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 scripts/pr-ci.py check

  quality:
    needs: target
    name: Format, Clippy, docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - run: sh scripts/install-ci-tools.sh core
      - run: python3 tests/pr-ci.py
      - run: python3 tests/build-metadata.py
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo +stable doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    needs: target
    name: Build and test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msrv, stable]
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          source scripts/ci-versions.sh
          if [[ "$TOOLCHAIN" == msrv ]]; then
            sh scripts/install-ci-tools.sh msrv
            echo "RUSTUP_TOOLCHAIN=$CI_MSRV" >> "$GITHUB_ENV"
          else
            sh scripts/install-ci-tools.sh core
            echo 'RUSTUP_TOOLCHAIN=stable' >> "$GITHUB_ENV"
          fi
      - name: Identify Rust compiler
        id: compiler
        run: echo "hash=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust build dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (MIT)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: cargo-v1-${{ runner.os }}-test-${{ steps.compiler.outputs.hash }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'scripts/ci-versions.sh') }}
          restore-keys: cargo-v1-${{ runner.os }}-test-${{ steps.compiler.outputs.hash }}-
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo test --locked --release --workspace --all-targets --all-features
      - run: cargo build --locked --release --workspace --all-features

  miri:
    needs: target
    name: Miri
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - run: sh scripts/install-ci-tools.sh miri
      - run: |
          source scripts/ci-versions.sh
          MIRIFLAGS=-Zmiri-no-extra-rounding-error cargo +"$CI_NIGHTLY" miri test --locked --lib

  coverage:
    needs: target
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - run: sh scripts/install-ci-tools.sh core
      - run: sh scripts/install-ci-tools.sh coverage
      - run: |
          mkdir -p target/coverage
          cargo +stable llvm-cov --locked --workspace --all-features --lcov --output-path target/coverage/lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-coverage
          path: target/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  dependencies:
    needs: target
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - run: sh scripts/install-ci-tools.sh core
      - run: sh scripts/install-ci-tools.sh audit
      - run: cargo +stable deny --locked check

  vst3:
    needs: target
    name: VST3 ABI and Validator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - run: sh scripts/install-ci-tools.sh core
      - name: Identify Rust compiler
        id: compiler
        run: echo "hash=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust build dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (MIT)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/x86_64-unknown-linux-gnu
            target/x86_64-pc-windows-msvc
          key: cargo-v1-${{ runner.os }}-vst3-${{ steps.compiler.outputs.hash }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'scripts/ci-versions.sh') }}
          restore-keys: cargo-v1-${{ runner.os }}-vst3-${{ steps.compiler.outputs.hash }}-
      - name: Configure MSVC for ABI validation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC build tools not found' }
          & cmd.exe /d /s /c "call `"$installation\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set" |
            Where-Object { $_ -match '^(PATH|INCLUDE|LIB|LIBPATH|VSCMD_ARG_TGT_ARCH)=' } |
            ForEach-Object { $_ >> $env:GITHUB_ENV }
          if ($LASTEXITCODE -ne 0) { throw 'VsDevCmd failed' }
      - name: Windows static analysis
        if: runner.os == 'Windows'
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Install Linux GUI validation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst6 libxfixes3 libxkbcommon-x11-0 libgl1-mesa-dri libegl1 xvfb xauth
      - name: Prepare Windows software OpenGL for GUI validation
        if: runner.os == 'Windows'
        run: |
          source scripts/ci-versions.sh
          archive="$RUNNER_TEMP/mesa.7z"
          python -c 'import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])' \
            "https://github.com/pal1000/mesa-dist-win/releases/download/$CI_MESA_WINDOWS/mesa3d-$CI_MESA_WINDOWS-release-msvc.7z" "$archive"
          echo "$CI_MESA_WINDOWS_SHA256  $archive" | sha256sum --check
          7z x "$archive" "-o$RUNNER_TEMP/mesa" x64/opengl32.dll x64/libgallium_wgl.dll
          mkdir -p target
          cp "$RUNNER_TEMP/mesa/x64/"*.dll target/
          echo 'GALLIUM_DRIVER=llvmpipe' >> "$GITHUB_ENV"
      - name: Fetch official SDK for validation
        run: |
          source scripts/ci-versions.sh
          sdk_dir="$RUNNER_TEMP/vst3-sdk"
          git init "$sdk_dir"
          git -C "$sdk_dir" remote add origin https://github.com/steinbergmedia/vst3sdk.git
          git -C "$sdk_dir" fetch --depth 1 origin "$CI_VST3_REVISION"
          git -C "$sdk_dir" checkout --detach FETCH_HEAD
          git -C "$sdk_dir" submodule update --init --depth 1 base cmake pluginterfaces public.sdk
          echo "VST3_SDK_DIR=$sdk_dir" >> "$GITHUB_ENV"
      - name: Verify ABI, version, audio and GUI
        id: bundle
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a python scripts/check-abi.py --gui
          else
            python scripts/check-abi.py --gui
          fi
      - name: Build Validator
        run: |
          cmake -S "$VST3_SDK_DIR" -B target/vst3-sdk \
            -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF \
            -DSMTG_CREATE_PLUGIN_LINK=OFF
          cmake --build target/vst3-sdk --config Release --target validator --parallel 4
      - name: Check Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dependencies = & dumpbin /dependents target/vst3/Integral.vst3/Contents/x86_64-win/Integral.vst3
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          $dependencies | Tee-Object -FilePath target/windows-dependencies.log
          if ($dependencies -match '(?i)(VCRUNTIME|MSVCP)\d[^\s]*\.dll') {
            throw 'Unexpected dynamic VC runtime dependency'
          }
      - name: Run Validator
        run: |
          target/vst3-sdk/bin/Release/validator target/vst3/Integral.vst3 |& tee target/validator.log
          if grep -Eq 'Failed|Error|\[FAILED\]' target/validator.log; then
            echo 'Validator reported an error, including possible teardown failures.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: vst3-validation-log-${{ runner.os }}
          path: |
            target/validator.log
            target/gui-smoke.ppm
          if-no-files-found: warn
          retention-days: 14
      # upload-artifactのZIPにバンドルを直接格納し、ZIPの二重梱包を避ける。
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: target/vst3/
          if-no-files-found: error
          retention-days: 14
      - name: Download information
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          PLUGIN_VERSION: ${{ steps.bundle.outputs.version }}
          BUILD_COMMIT: ${{ steps.bundle.outputs.commit }}
        run: |
          echo "[Download VST3 bundle ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: $PLUGIN_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $BUILD_COMMIT" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI result
    if: always()
    needs: [target, quality, test, miri, coverage, dependencies, vst3]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Report and require all checks to pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TARGET_RESULT: ${{ needs.target.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          state=success
          for result in $RESULTS; do
            if [[ "$result" != success ]]; then
              echo "CI job did not succeed: $result" >&2
              state=failure
            fi
          done
          if [[ -n "$PR_NUMBER" ]]; then
            [[ "$TARGET_RESULT" == success ]] || TARGET_RESULT=failure
            for context in 'PR target' 'CI result'; do
              result="$state"
              [[ "$context" != 'PR target' ]] || result="$TARGET_RESULT"
              gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
                -f state="$result" -f context="$context" \
                -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
            done
          fi
          [[ "$state" == success ]]
